episode:
  title: "Untitled Episode"
  script: "assets/scripts/episode_001.md"

characters:
  hero:
    reference: "assets/characters/hero/reference.png"
    description: "assets/characters/hero/profile.md"
  villain:
    reference: "assets/characters/villain/reference.png"
    description: "assets/characters/villain/profile.md"

video:
  provider: "openrouter"        # openrouter | minimax
  model: "x-ai/grok-imagine-video-1.5"
  base_url: "https://openrouter.ai/api/v1"   # minimax-only
  duration_seconds: 8
  resolution: "1080p"
  aspect_ratio: "16:9"
  generate_audio: true
  # Optional: public HTTPS URL for the first frame (avoids file upload).
  # Otherwise the local reference image is uploaded via the Files API
  # (requires a management key).
  frame_image_url: ""

images:
  model: "qwen/qwen-image-3"
  resolution: "1K"
  aspect_ratio: "3:4"
  prompt_prefix: "Character design reference sheet, consistent character, full body, clean neutral background, "

music:
  model: "google/lyria-3-clip-preview"
  format: "mp3"
  prompt: "Cinematic orchestral background score, dark fantasy, building tension, no vocals"
  image_url: ""

tts:
  provider: "edge"
  voice: "en-US-GuyNeural"
  speed: 1.0

editing:
  transition: "crossfade"
  transition_duration: 0.5
  music_volume: 0.15
  voiceover_volume: 1.0

paths:
  clips: "generated/clips"
  voiceover: "generated/voiceover"
  music: "generated/music"
  drafts: "generated/drafts"
  final: "generated/final"
